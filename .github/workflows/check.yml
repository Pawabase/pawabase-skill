name: Check skill

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Pawabase/pawabase-docs
          ref: 27c168aa616e60bdfd3e789bb51ef7866c276097
          path: pawabase-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_skill.py --docs pawabase-docs
      - run: python3 scripts/build_catalog.py --docs pawabase-docs --check
